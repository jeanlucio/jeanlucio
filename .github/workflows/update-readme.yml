name: Update README with latest repos

on:
  schedule:
    # 13:15, 15:15 e 21:15 UTC (10:15, 12:15 e 18:15 no Horário de Brasília - BRT)
    # Evita o minuto '0' para não sofrer atrasos nas filas globais do GitHub Actions
    - cron: '15 13,15,21 * * *'
  workflow_dispatch: # Permite rodar manualmente a qualquer momento

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_readme.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          # Só faz o commit se houver alguma mudança
          git commit -m "docs: Atualiza lista de últimos repositórios 🤖" || echo "No changes to commit"
          git push
